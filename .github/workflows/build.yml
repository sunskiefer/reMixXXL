name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc qemu-user
          pip install ziglang pillow numpy

      # reMixXXL and reMixXXL CUE, each for armv7 (Gen1 MPCs and the Force) and aarch64 (Gen2 MPCs), glibc 2.31
      - name: Build reMixXXL (armv7 and aarch64) and the skin
        run: |
          ./build.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
          tail -3 build.log

      - name: Build reMixXXL CUE (armv7 and aarch64)
        run: |
          ./cue/build.sh > cue-build.log 2>&1 || { tail -40 cue-build.log; exit 1; }
          tail -3 cue-build.log

      # the parameter lists and layouts are part of the repo: a build must not change them
      - name: Parameters and layouts unchanged
        run: git diff --exit-code params.json params.lock layout.conf cue/params.json cue/params.lock cue/layout.conf

      - name: Tests (ARM code, 32-bit and 64-bit, under qemu)
        run: test/arm_sim.sh

      # A release is made by a v* tag, or by a push to main whose top CHANGELOG version ("## X.Y.Z") has no tag yet.
      - name: Version
        id: ver
        run: |
          REL=0; V="0.0.0-dev"
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; REL=1 ;;
            refs/heads/main)
              C=$(sed -n 's/^## \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*$/\1/p' CHANGELOG.md | head -1)
              if [ -n "$C" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$C" > /dev/null; then V="$C"; REL=1; fi ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "release=$REL" >> "$GITHUB_OUTPUT"; echo "version $V, release $REL"

      # the version in the zips comes from vst.json (tools/package.sh): a release must agree with the tag / CHANGELOG
      - name: Release version matches vst.json
        if: steps.ver.outputs.release == '1'
        run: |
          J=$(python3 -c "import json;v=json.load(open('vst.json'))['version'];print('%d.%d.%d'%(v//10000,(v//100)%100,v%100))")
          [ "$J" = "${{ steps.ver.outputs.version }}" ] || { echo "vst.json says $J, the release is ${{ steps.ver.outputs.version }}"; exit 1; }

      # The zips as the Open MPC catalog reads them, made with the open-mpc release tools (third_party/open-mpc-release,
      # with the L'Cronx apostrophe shell-escaped), for reMixXXL and reMixXXL CUE: -mpc-armv7.zip (Gen1 MPCs and the Force),
      # -mpc-aarch64.zip (Gen2 MPCs) and -mpc-sdk.zip (Akai's one-folder format, MPC OS 3.10.1).
      - name: Package
        run: tools/package.sh

      # the apostrophe in L'Cronx must never break the installer
      - name: Installer scripts parse (sh -n)
        run: |
          for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
            rm -rf chk && mkdir chk && (cd chk && unzip -q "../$z" && sh -n */install.sh && sh -n */uninstall.sh && echo "$z: ok")
          done

      - name: Catalog check
        if: steps.ver.outputs.release == '1'
        run: |
          for z in dist/*-mpc-armv7.zip dist/*-mpc-aarch64.zip; do
            python3 third_party/open-mpc-release/catalog_check.py "$z" --catalog
          done

      - uses: actions/upload-artifact@v4
        with:
          name: reMixXXL-mpc
          path: dist/*.zip

      - name: Release
        if: steps.ver.outputs.release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: reMixXXL ${{ steps.ver.outputs.version }}
          body_path: .github/RELEASE_NOTES.md
          files: dist/*.zip
          prerelease: true

      # A version listed in tested.json (tried on a device) is a full release, not a pre-release; the newest tested one is Latest.
      - name: Promote tested releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in $(python3 -c "import json; print(' '.join(sorted({e['version'] for e in json.load(open('tested.json'))})))"); do
            if [ "$(gh release view "v$v" --json isPrerelease -q .isPrerelease 2>/dev/null)" = "true" ]; then
              gh release edit "v$v" --prerelease=false && echo "v$v: now a full release"
            fi
          done
          L=$(python3 -c "import json; v=sorted({e['version'] for e in json.load(open('tested.json'))}, key=lambda x: tuple(int(n) for n in x.split('.'))); print(v[-1])")
          gh release edit "v$L" --latest && echo "v$L: marked Latest"
